name: Deploy web build

# The hosted page is not decoration: it is what every shared run link opens, where the privacy
# policy and app-ads.txt live, and the thing posted to communities so people can play in three
# seconds instead of installing. A stale copy of it is worse than none, because the link people
# judge the game by is the one they were sent.
#
# BEFORE THIS WORKS: GitHub -> Settings -> Pages -> Source must be set to "GitHub Actions".
# If it is still set to "Deploy from a branch", this workflow will fail at the deploy step.

# Named explicitly rather than resolved at run time. This previously triggered on every branch
# and used `if: github.ref_name == github.event.repository.default_branch` to deploy only from
# the trunk, so that renaming the default branch could not silently stop deployments. The
# rename happened, and it stopped deployments anyway: the merge that should have published the
# site evaluated that condition against the pre-rename default name and skipped. A workflow
# whose trigger cannot be read off the file is a workflow nobody can debug.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue rather than cancel, so a deploy in flight finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish docs/
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Rebuilds the single-file game and refreshes docs/, so the published page always matches
      # the committed source rather than whenever someone last remembered to run it.
      - name: Build the page
        run: npm run web

      # enablement turns Pages on via the API if it is off, and switches the source to GitHub
      # Actions — which otherwise has to be done by hand in Settings before any of this works,
      # and is the sort of prerequisite that is only discovered when the deploy fails.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
